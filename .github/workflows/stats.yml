name: "✨ refresh profile stats"

# Rebuild README.md + assets/banner.svg from live GitHub data, then commit back.
# Runs every 6 hours, on a manual dispatch, and right after each push.
on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"   # every 6 hours (small offset to spread load)
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate README + banner
        run: node scripts/generate_readme.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "profile-readme[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/banner.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "🤖 auto: refresh profile stats"
            git push
          fi